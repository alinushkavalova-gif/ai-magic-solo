<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Magic — a race for three seals (solo)</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b1738; --night2:#2a2352; --night3:#3b3170;
  --parch:#fbf3de; --parch2:#f0e3c0; --parch3:#e2d1a6;
  --ink:#2a1f3d; --ink2:#5a4a73;
  --gold:#e6a92e; --gold2:#b87d12; --ruby:#c9442c; --teal:#25818e; --moss:#587f35; --violet:#7a55b8;
  --ok:#2f7d3a; --bad:#b3341f;
  --px:'Pixelify Sans','Press Start 2P',ui-monospace,monospace;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -10%,#3a2f78 0,transparent 70%),var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--ink)}
[hidden]{display:none!important}

/* ---------- buttons ---------- */
.btn{font-family:var(--px);font-weight:600;font-size:18px;letter-spacing:.02em;background:var(--gold);color:var(--ink);
  border:3px solid var(--ink);border-radius:6px;padding:10px 20px;box-shadow:0 5px 0 var(--gold2),0 5px 0 3px var(--ink);
  transform:translateY(0);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold2),0 1px 0 3px var(--ink)}
.btn[disabled]{background:var(--parch3);color:#8d7f66;box-shadow:0 5px 0 #bba98a,0 5px 0 3px var(--ink);cursor:not-allowed;filter:none}
.btn.ghost{background:var(--parch);box-shadow:0 5px 0 var(--parch3),0 5px 0 3px var(--ink)}
.btn.sm{font-size:15px;padding:6px 12px}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1320px;margin:0 auto;padding:12px 18px 8px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img{width:44px;height:44px;object-fit:contain;background:var(--night2);border:3px solid var(--night3);border-radius:6px;padding:2px}
.who b{font-family:var(--px);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.passport{display:flex;gap:10px;align-items:center}
.seal{width:46px;height:46px;border-radius:50%;border:3px dashed var(--night3);display:grid;place-items:center;font-size:22px;filter:grayscale(1) opacity(.35);transition:.3s}
.seal.on{border:3px solid #5d1608;filter:none;background:radial-gradient(circle at 35% 30%,#e8654a,var(--ruby) 55%,#8c2412);box-shadow:inset 0 0 0 3px #e98a74,0 0 0 3px rgba(230,169,46,.35)}
.clock{font-family:var(--px);text-align:right;line-height:1}
.clock .t{font-size:34px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.clock .p{display:block;font-size:14px;color:#ff9a86;min-height:16px;margin-top:3px}
.clock.flash .t{animation:flash .7s}
@keyframes flash{0%,100%{color:var(--gold)}25%,75%{color:#ff6a50;transform:scale(1.12)}}

/* ---------- layout ---------- */
.play{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;max-width:1320px;margin:0 auto;padding:6px 18px 40px}
.stage{position:relative;aspect-ratio:3/2;border-radius:8px;overflow:hidden;background:#fbf6ea;
  box-shadow:0 0 0 4px var(--night3),0 0 0 7px var(--ink),0 14px 0 7px rgba(0,0,0,.25)}
.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.stage.fade>img.bg{animation:fadein .7s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.player{position:absolute;width:7.6%;transform:translate(-50%,-90%);z-index:4;pointer-events:none;transition-property:left,top;transition-timing-function:linear}
.player .fl{position:relative}
.player .fl.flip{transform:scaleX(-1)}
.player img{width:100%;filter:drop-shadow(0 6px 0 rgba(30,20,50,.28))}
.player.walk img{animation:bob .28s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6%)}}
.hs{position:absolute;z-index:6;width:22px;height:22px;transform:translate(-50%,-50%);background:none;border:0;padding:0}
.hs .pin{display:block;width:22px;height:22px;background:var(--gold);border:3px solid var(--ink);transform:rotate(45deg);position:relative;box-shadow:0 3px 0 var(--ink)}
.hs.active .pin::after{content:"";position:absolute;inset:-9px;border:3px solid var(--gold);animation:ring 1.5s ease-out infinite}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.35);opacity:0}}
.hs .lbl{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);font-family:var(--px);background:var(--parch);color:var(--ink);border:3px solid var(--ink);border-radius:5px;padding:2px 8px 3px;text-align:center;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.35);font-size:14px;line-height:1.15;pointer-events:none}
.hs.up .lbl{top:auto;bottom:calc(100% + 8px)}
.hs .lbl small{display:block;font-family:var(--body);font-size:11.5px;font-weight:500;color:var(--ink2)}
.hs.dim .pin{background:#9a8fb4}
.hs.dim .lbl{opacity:0;transition:.15s}
.hs.dim:hover .lbl,.hs.dim:focus-visible .lbl{opacity:1}
.hs.done .pin{background:var(--moss)}
.hs.done .pin::before{content:"✓";position:absolute;inset:0;transform:rotate(-45deg);color:#fff;font:700 13px/16px var(--px);text-align:center}
.hs.lock .pin{background:#8a7fa6}
.hs.lock .lbl{opacity:.85}
.hs.npc .pin{background:#fff}
.dialog{display:flex;gap:14px;align-items:flex-start;margin-top:22px;background:var(--parch);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:12px 16px;box-shadow:6px 6px 0 #0f0b24;min-height:92px}
.dialog img{width:68px;height:68px;object-fit:contain;flex:none;background:var(--parch2);border:3px solid var(--ink);border-radius:6px;padding:2px}
.dialog b{font-family:var(--px);font-size:18px}
.dialog p{margin:2px 0 0;font-size:17px;max-width:68ch}
.dialog.pop{animation:pop .25s}
@keyframes pop{from{transform:translateY(6px);opacity:.4}}

.side{display:flex;flex-direction:column;gap:18px}
.card{background:var(--parch);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:14px 16px;box-shadow:6px 6px 0 #0f0b24}
.card h3{font-family:var(--px);font-size:19px;margin:0 0 6px}
.obj{margin:0 0 12px;font-size:16px}
.lv{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;align-items:center;font-size:14px;margin:7px 0}
.lv .n{font-family:var(--px);font-weight:700;background:var(--ink);color:var(--parch);border-radius:4px;text-align:center;font-size:14px}
.lv.cur .n{background:var(--ruby)}
.pips{grid-column:2;display:flex;gap:4px}
.pips i{flex:1;height:8px;background:var(--parch3);border:2px solid var(--ink);border-radius:2px}
.pips i.f{background:var(--moss)}
.pips i.c{background:var(--gold)}

/* ---------- race board ---------- */
.race h3{display:flex;justify-content:space-between;align-items:baseline}
.race h3 small{font:500 12px var(--body);color:var(--ink2)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{color:var(--ink);display:grid;grid-template-columns:38px 1fr auto;gap:3px 10px;align-items:center;padding:6px 8px;border:2px solid var(--parch3);border-radius:6px;background:#fff9ea}
.row.you{border-color:var(--ink);background:#fff3c9}
.row img{width:38px;height:38px;object-fit:contain;grid-row:1/4}
.row .nm{display:flex;gap:6px;align-items:baseline;min-width:0}
.row .nm b{font-family:var(--px);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{grid-column:2;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.row .tm{font-family:var(--px);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;grid-row:1/4;grid-column:3;text-align:right}
.row .tm small{display:block;font:500 11px var(--body);color:var(--bad)}
.trk{display:flex;gap:3px}
.trk i{display:block;height:9px;background:var(--parch3);border:2px solid var(--ink);border-radius:2px;position:relative;overflow:hidden}
.trk i::after{content:"";position:absolute;inset:0;width:var(--f,0%);background:var(--teal);transition:width .5s}
.trk i.full::after{background:var(--gold)}
.row.fin{background:#e8f4dc}
.rank{font-family:var(--px);color:var(--ink2)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(14,10,36,.72);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;backdrop-filter:blur(2px)}
.sheet{background:var(--parch);color:var(--ink);border:4px solid var(--ink);border-radius:10px;box-shadow:8px 8px 0 #0a0720;width:min(760px,100%);padding:20px 22px 22px;position:relative;animation:sheetin .22s}
@keyframes sheetin{from{transform:translateY(14px);opacity:0}}
.sheet.wide{width:min(900px,100%)}
.sheet h2{font-family:var(--px);font-size:28px;line-height:1.1;margin:0 0 8px}
.sheet h4{font-family:var(--px);font-size:18px;margin:18px 0 8px}
.sheet p{margin:6px 0}
.sheet .x{position:absolute;top:10px;right:12px;width:34px;height:34px;border:3px solid var(--ink);background:var(--parch2);border-radius:6px;font:700 16px var(--px);line-height:1}
.sheet .acts{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:18px;flex-wrap:wrap}
.muted{color:var(--ink2);font-size:14px}
.fb{margin-top:12px;border-radius:6px;padding:10px 12px;font-size:15px;border:2px solid}
.fb.bad{background:#fde5dd;border-color:var(--bad);color:#6d1c0e}
.fb.ok{background:#e1f2d6;border-color:var(--ok);color:#1d4b25}
.fb.info{background:#e6eefc;border-color:#4a68b0;color:#1f2f5c}
.fb b{font-family:var(--px)}
.fb ul{margin:4px 0 0;padding-left:18px}
.pill{display:inline-block;font:600 12px var(--body);padding:1px 8px;border-radius:99px;background:var(--ink);color:var(--parch)}

/* choose station result */
.res{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:start}
.res .big{font-family:var(--px);font-size:46px;line-height:1;width:70px;height:70px;border:4px solid var(--ink);border-radius:8px;display:grid;place-items:center}
.res.best .big{background:#bfe3a7}.res.ok .big{background:#f6dc9a}.res.miss .big{background:#f3b4a5}

/* title */
.screen{position:fixed;inset:0;z-index:40;overflow:auto;background:
  radial-gradient(1000px 500px at 20% 0,#4a3b92 0,transparent 65%),radial-gradient(900px 600px at 100% 100%,#2a4f7a 0,transparent 60%),var(--night)}
.title{max-width:1120px;margin:0 auto;padding:4vh 18px;display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:stretch}
.tl-art{position:relative;border-radius:10px;overflow:hidden;border:4px solid var(--ink);box-shadow:0 0 0 4px var(--night3),10px 10px 0 #0a0720;min-height:380px;background:#000}
.tl-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.tl-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,50,.1) 30%,rgba(20,14,50,.9))}
.tl-head{position:absolute;left:24px;right:24px;bottom:22px;z-index:2}
.tl-head h1{font-family:var(--px);font-size:clamp(46px,7vw,82px);line-height:.95;margin:0;color:var(--gold);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.tl-head p{font-family:var(--px);font-size:24px;margin:8px 0 0;color:#fff;text-shadow:3px 3px 0 var(--ink)}
.tl-form{background:var(--parch);color:var(--ink);border:4px solid var(--ink);border-radius:10px;box-shadow:10px 10px 0 #0a0720;padding:22px}
.tl-form h2{font-family:var(--px);font-size:24px;margin:0 0 12px}
.tl-form label{display:block;font-weight:600;font-size:14px}
.tl-form input{width:100%;margin-top:4px;font:inherit;font-size:18px;padding:9px 12px;border:3px solid var(--ink);border-radius:6px;background:#fff}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.hero{background:var(--parch2);border:3px solid var(--ink);border-radius:8px;padding:8px 6px;text-align:center;color:var(--ink);transition:transform .1s}
.hero img{height:84px;margin:0 auto 4px;object-fit:contain}
.hero b{display:block;font-family:var(--px);font-size:17px}
.hero small{font-size:12px;color:var(--ink2);line-height:1.2;display:block}
.hero:hover{transform:translateY(-2px)}
.hero[aria-pressed=true]{background:#ffe9a8;box-shadow:0 0 0 4px var(--gold),0 0 0 7px var(--ink)}
.quote{font-style:italic;color:var(--ink2);margin:16px 0 0;font-size:14px;text-align:center}

/* story */
.broken{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.broken li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--parch2);border:2px solid var(--parch3);border-radius:8px;padding:8px 10px}
.broken .ic{font-size:26px;text-align:center}
.slots{display:flex;gap:12px;justify-content:center;margin:12px 0}
.slots .seal{border-color:var(--ink2);filter:none;opacity:.55}

/* seal ceremony */
.stampwrap{display:grid;place-items:center;height:170px}
.bigseal{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:62px;border:6px solid #5d1608;background:radial-gradient(circle at 35% 30%,#ef7358,var(--ruby) 55%,#8c2412);box-shadow:inset 0 0 0 6px #e98a74,0 0 0 6px rgba(230,169,46,.5);animation:stamp .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{transform:scale(3) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.countdown{font-family:var(--px);font-size:120px;text-align:center;color:var(--ruby);line-height:1;animation:pop .3s}

/* L1 tool pick note */
.station-tag{font-family:var(--px)}

/* trial */
.mirror{background:linear-gradient(160deg,#2c2a63,#3b6e92 60%,#7a55b8);color:#fff;border:4px solid var(--gold);border-radius:12px 12px 4px 4px;padding:14px 18px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.mirror small{font-family:var(--px);font-size:14px;opacity:.9}
.mirror blockquote{margin:6px 0 2px;font-size:22px;font-weight:600;line-height:1.25}
.mirror .cite{display:inline-block;margin-top:6px;background:rgba(255,255,255,.18);border-radius:4px;padding:2px 8px;font-size:13px}
.srcs{display:grid;gap:8px}
.src{border:2px solid var(--ink);border-radius:8px;background:#fffaf0;overflow:hidden}
.src>header{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--parch2)}
.src>header b{flex:1;font-size:15px}
.src .body{padding:10px 12px;font-size:15px;border-top:2px dashed var(--parch3)}
.src label{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:600;cursor:pointer}
.src.sel{box-shadow:0 0 0 3px var(--gold)}
.src.wrong{box-shadow:0 0 0 3px var(--bad)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-radius:8px;background:#fffaf0;padding:9px 12px;cursor:pointer;text-align:left;width:100%;font-size:15px}
.opt input{margin-top:4px}
.opt.sel{background:#ffe9a8;box-shadow:0 0 0 3px var(--gold)}
.opt.wrong{background:#fde5dd;box-shadow:0 0 0 3px var(--bad)}
.opt.right{background:#e1f2d6;box-shadow:0 0 0 3px var(--ok)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cardopt{border:3px solid var(--ink);border-radius:8px;background:#fffaf0;padding:12px;text-align:left;font-size:15px;min-height:76px;transition:transform .1s}
.cardopt:hover{transform:translateY(-2px)}
.cardopt.sel{background:#ffe9a8;box-shadow:0 0 0 3px var(--gold)}
.cardopt.shake{animation:shake .4s;background:#fde5dd}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.promptbox{background:#2a1f3d;color:#f7ecd0;border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.55;white-space:pre-wrap;border:3px solid var(--ink)}
.promptbox b{color:var(--gold)}
.promptbox s{color:#ff9a86}
.slack{border:2px solid var(--ink);border-radius:8px;background:#fff;padding:10px 12px 12px;font-size:16px;line-height:1.5}
.slack .msg{white-space:pre-wrap}
.slack .hd{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:6px}
.slack .hd i{width:26px;height:26px;border-radius:5px;background:var(--violet);display:inline-block}
.tok{cursor:pointer;border-radius:3px;padding:0 1px}
.tok:hover{background:#ffe9a8}
.tok.sel{background:var(--gold);outline:2px solid var(--ink)}
.tok.flag{background:#fbc9bd;outline:2px dashed var(--bad)}
.tok.fixed{background:#bfe3a7}
.chk{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:15px}
.chk li{display:flex;gap:8px}
.chk .y{color:var(--ok);font-weight:700}.chk .n{color:var(--bad);font-weight:700}
.chatgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.chatgrid h4:first-child{margin-top:0}
.chat{display:grid;gap:8px;margin:0;max-height:340px;overflow:auto;padding:2px 4px 2px 0;align-content:start}
.bub.her{justify-self:start}
.bub{max-width:88%;border-radius:10px;padding:8px 12px;font-size:15px;border:2px solid var(--ink)}
.bub.me{justify-self:end;background:#ffe9a8}
.bub.her{background:#fff}
.qs{display:flex;flex-wrap:wrap;gap:8px}
.q{border:2px solid var(--ink);background:var(--parch2);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:500}
.q[disabled]{opacity:.45;cursor:default}
.notes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.note{border:2px dashed var(--ink2);border-radius:6px;padding:6px 8px;font-size:13.5px;min-height:46px;background:#fffdf4}
.note.f{border-style:solid;border-color:var(--moss);background:#eef7e2}
.note small{display:block;font-family:var(--px);font-size:13px;color:var(--ink2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);background:var(--parch2);border-radius:8px;padding:8px 10px;font-size:14px;text-align:left;max-width:100%}
.chip b{font-family:var(--px);font-size:18px;margin-right:6px}
.chip.sel{background:#ffe9a8;box-shadow:0 0 0 3px var(--gold)}
.spin{width:44px;height:44px;border:6px solid var(--parch3);border-top-color:var(--violet);border-radius:50%;animation:rot .8s linear infinite;margin:18px auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* toast */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--parch);border:3px solid var(--parch);border-radius:8px;padding:8px 14px;font-size:15px;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .2s}
.toast.bad{background:var(--bad)}
.toast b{font-family:var(--px)}

/* host */
.host{max-width:1100px;margin:0 auto;padding:22px 18px 50px}
.host header{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.host h1{font-family:var(--px);font-size:44px;margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--ink)}
.hclock{font-family:var(--px);font-size:72px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.hbtn{display:flex;gap:10px;flex-wrap:wrap}
.host .rows{margin-top:22px;gap:10px}
.host .row{grid-template-columns:64px 1fr auto;padding:10px 14px}
.host .row img{width:60px;height:60px}
.host .row .nm b{font-size:24px}
.host .row .st{font-size:15px}
.host .row .tm{font-size:26px}
.host .trk i{height:16px}
.host .note2{margin-top:20px;color:#cfc6ee;font-size:14px}
.debrief{margin-top:20px;background:var(--parch);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:14px 18px;box-shadow:6px 6px 0 #0a0720}
.debrief h3{font-family:var(--px);margin:0 0 6px}

#dev{position:fixed;left:8px;bottom:8px;z-index:90;background:#000a;padding:6px;border-radius:8px;display:flex;gap:6px;font-size:12px}
#dev button{padding:3px 8px;border-radius:4px;border:1px solid #fff6;background:#222;color:#fff}

@media (max-width:1000px){
  .play{grid-template-columns:1fr}
  .title{grid-template-columns:1fr}
  .tl-art{min-height:240px}
  .clock .t{font-size:26px}
  .hs .lbl{font-size:11px;padding:1px 5px}
  .hs .lbl small{display:none}
  .hs .pin{width:16px;height:16px}
  .dialog p{font-size:15px}
}
@media (max-width:760px){.chatgrid{grid-template-columns:1fr}.chat{max-height:220px}}
@media (max-width:560px){
  .passport .seal{width:34px;height:34px;font-size:16px}
  .who b{font-size:16px}
  .sheet{padding:16px 14px}
  .sheet h2{font-size:23px}
  .notes{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---- online additions ---- */
.row.off{opacity:.5}
.row .rm{margin-left:auto;border:2px solid var(--ink);background:var(--parch2);border-radius:4px;font:700 11px var(--px);line-height:1;padding:2px 5px;color:var(--ink)}
.roomchip{display:inline-block;font:600 13px var(--body);background:var(--ink);color:var(--parch);border-radius:99px;padding:2px 10px;margin-top:6px}
.host .lead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-top:18px}
.joinbox{background:var(--parch);color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 #0a0720;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.joinbox h3{font-family:var(--px);margin:0 0 4px;font-size:18px}
.joinbox code{display:block;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:6px 8px;font-size:15px;word-break:break-all;margin:6px 0}
.joinbox .qr{width:120px;height:120px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:4px;display:grid;place-items:center}
.joinbox .qr svg{width:100%;height:100%}
.roomrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.roomrow input,.login input{font:inherit;font-size:16px;padding:6px 10px;border:3px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink)}
.roomrow input{width:170px}
.lobby{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.lobby .p{display:flex;gap:8px;align-items:center;background:var(--parch);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:6px 12px 6px 8px;font-family:var(--px);font-size:18px}
.lobby .p img{width:34px;height:34px;object-fit:contain}
.login{max-width:420px;margin:12vh auto;background:var(--parch);color:var(--ink);border:4px solid var(--ink);border-radius:10px;box-shadow:8px 8px 0 #0a0720;padding:22px}
.login h2{font-family:var(--px);margin:0 0 10px}
.login input{width:100%;font-size:18px;padding:9px 12px;margin:8px 0 12px}
.err{color:var(--bad);font-weight:600;min-height:22px}
.status{font-family:var(--px);font-size:22px;margin:14px 0 0;color:#fff}
@media (max-width:800px){.host .lead,.joinbox{grid-template-columns:1fr}}

.rows .gap{list-style:none;text-align:center;color:var(--ink2);font-size:12px;padding:0}
.host .rows .gap{color:#cfc6ee;font-size:14px}
</style>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PEN=15, LIMIT=24*60, TOTAL=17;

const LV_RANGE=[[0,4],[4,8],[8,17]];
const STATUS=['Picking a tool','Picking a tool','Picking a tool','Finding a source',
  'Checking a mirror','Checking a mirror','Checking a mirror','Writing instructions',
  'Building spell 1','Patching spell 1','Testing spell 1',
  'Building spell 2','Patching spell 2','Testing spell 2',
  'Building spell 3','Patching spell 3','Testing spell 3'];
const MEDAL=['🥇','🥈','🥉'];

function rowHTML(r,rank){
  const seg=i=>{const [a,b]=LV_RANGE[i];return clamp((r.done-a)/(b-a),0,1);};
  const st=(r.fin||r.done>=TOTAL)?'Finished':STATUS[Math.min(r.done,TOTAL-1)];
  const rk=(r.fin&&rank<=3)?MEDAL[rank-1]:rank;
  return `<li class="row${r.you?' you':''}${r.fin?' fin':''}${r.off?' off':''}">
    <img src="${CH[r.hero]||CH[0]}" alt="">
    <div class="nm"><span class="rank">${rk}</span><b>${esc(r.name)}${r.you?' (you)':''}</b>${r.rm?`<button class="rm" data-rm="${esc(r.id)}" title="Remove player" aria-label="Remove ${esc(r.name)}">✕</button>`:''}</div>
    <div class="trk">${[0,1,2].map(i=>{const f=seg(i);return `<i class="${f>=1?'full':''}" style="flex:${LV_RANGE[i][1]-LV_RANGE[i][0]};--f:${f*100}%"></i>`;}).join('')}</div>
    <div class="st">${r.off?'Offline · ':''}${st}</div>
    <div class="tm">${fmt(r.time)}${r.pen?`<small>+${r.pen*PEN} s</small>`:''}</div></li>`;
}
function sortRows(rows){
  return rows.slice().sort((a,b)=>{
    if(a.fin!==b.fin) return a.fin?-1:1;
    if(a.fin&&b.fin) return a.time-b.time;
    return b.done-a.done||a.time-b.time;
  });
}

/* Fisher–Yates shuffle, cached per key. If isOk is given and exactly one item is correct,
   the correct item is never left in the first position. */
function order(key,arr,isOk){
  if(!S.orders[key]){
    const rnd=mulberry(hash(key)^Math.floor(S.seed*4294967296));
    const idx=arr.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
    if(isOk&&arr.filter(isOk).length===1&&isOk(arr[idx[0]])){
      const j=1+Math.floor(rnd()*(idx.length-1)); [idx[0],idx[j]]=[idx[j],idx[0]];
    }
    S.orders[key]=idx;
  }
  return S.orders[key].map(i=>arr[i]);
}

/* ---------- clock & board ---------- */
function tick(){
  if(S.phase==='title'||S.phase==='intro') return;
  const e=elapsed();
  if(S.phase==='race'&&e>=LIMIT&&!S.finished) return timeUp();
  $('clock').textContent=S.raceStart?fmt(e+S.pen*PEN):'0:00';
  $('penTxt').textContent=S.pen?`+${S.pen*PEN} s penalty`:'';
  renderRace();
}
function boardRows(forFinal){
  const e=elapsed();
  const me={id:S.id,name:S.name||'You',hero:S.hero,done:S.done,fin:S.finished,time:S.finished?S.finalTime:e+S.pen*PEN,pen:S.pen,you:true};
  let others=[];
  if(NET.on){
    const sn=nowS();
    others=NET.players.filter(p=>p.id!==S.id).map(p=>({id:p.id,name:p.name,hero:p.hero,done:p.done,fin:p.fin,pen:p.pen,
      off:!p.fin&&(sn-p.seen)>40000,
      time:p.fin?p.final:(NET.start?Math.max(0,(sn-NET.start)/1000)+p.pen*PEN:0)}));
  } else if(params.get('bots')!=='0'){
    others=BOT_DEF.map(b=>botRow(b,forFinal?Math.max(e,b.pace):(S.raceStart?e:0)));
  }
  return sortRows([me,...others]);
}
/* Compact leaderboard: the top N plus your own row, so 70 players still fit on a phone */
function compactRows(all,n){
  if(all.length<=n+1) return all.map((r,i)=>rowHTML(r,i+1)).join('');
  let html=all.slice(0,n).map((r,i)=>rowHTML(r,i+1)).join('');
  const me=all.findIndex(r=>r.you);
  if(me>=n) html+=`<li class="gap">…</li>`+rowHTML(all[me],me+1);
  return html+`<li class="gap">${all.length} players in the room</li>`;
}
function renderRace(){
  $('rows').innerHTML=compactRows(boardRows(),5);

function setScene(name,start){

function placePlayer(x,y){
  const p=$('player'); p.style.transitionDuration='0ms'; p.style.left=x+'%'; p.style.top=y+'%'; S.px=x;S.py=y;
}
function walkTo(x,y){
  return new Promise(res=>{
    const p=$('player'); const dx=x-S.px;
    const dist=Math.hypot(x-S.px,(y-S.py)*.67);
    const dur=REDUCED?10:Math.max(260,dist*30);
    $('plfl').classList.toggle('flip',dx<-0.5?true:(dx>0.5?false:$('plfl').classList.contains('flip')));
    p.style.transitionDuration=dur+'ms'; p.classList.add('walk');
    p.style.left=x+'%'; p.style.top=y+'%'; S.px=x;S.py=y;
    setTimeout(()=>{p.classList.remove('walk');res();},dur+40);
  });
}
function setHS(list){
  const box=$('hs'); box.innerHTML='';
  list.forEach(h=>{
    const b=el(`<button class="hs ${h.state||'active'}${h.npc?' npc':''}${h.up?' up':''}" style="left:${h.x}%;top:${h.y}%" aria-label="${esc(h.label)}">
      <span class="pin"></span><span class="lbl">${esc(h.label)}${h.sub?`<small>${esc(h.sub)}</small>`:''}</span></button>`);
    b.onclick=async()=>{
      if(S.busy||!$('overlay').hidden) return;
      if(h.state==='lock'&&h.lockMsg){toast(h.lockMsg);return;}
      S.busy=true; await walkTo(h.sx,h.sy); S.busy=false; h.act&&h.act();
    };
    box.appendChild(b);
  });
}

      <button class="btn sm ghost" data-open>Open</button>
      <label><input type="radio" name="ev" disabled> proof</label></header><div class="body" hidden>${s.b}</div></div>`).join('')}</div>
    <h4>2. Which conclusion is correct?</h4>
    <div class="opts">${opts.map(o=>`<label class="opt" data-k="${o.k}"><input type="radio" name="vd"><span>${o.t}</span></label>`).join('')}</div>
    <div id="fb"></div>
    <div class="acts"><span class="muted">Reading is free. A wrong submission costs +${PEN} s</span><button class="btn" id="sub">Submit check</button></div>`,{wide:true});
  sh.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const s=b.closest('.src'); const body=s.querySelector('.body'); body.hidden=!body.hidden;
    b.textContent=body.hidden?'Open':'Hide';
    s.querySelector('input').disabled=false;
  });
  sh.querySelectorAll('.src input').forEach(r=>r.onchange=()=>{ev=+r.closest('.src').dataset.k;
    sh.querySelectorAll('.src').forEach(x=>{x.classList.remove('wrong');x.classList.toggle('sel',x.dataset.k==ev);});});
  sh.querySelectorAll('.opt input').forEach(r=>r.onchange=()=>{vd=+r.closest('.opt').dataset.k;
    sh.querySelectorAll('.opt').forEach(x=>{x.classList.remove('wrong');x.classList.toggle('sel',x.dataset.k==vd);});});
  $('sub').onclick=()=>{
    const fb=$('fb');
    if(ev===null) return fb.innerHTML=`<div class="fb info">First open a source and mark the one that checks the claim.</div>`;
    if(vd===null) return fb.innerHTML=`<div class="fb info">Pick a conclusion.</div>`;
    const evOk=!!t.src[ev].ev, vdOk=!!t.opt[vd].ok;
    if(evOk&&vdOk){
      S.l2[i]=1; advance();
      fb.innerHTML=`<div class="fb ok"><b>Verified.</b> ${t.trick}</div>`;
      $('sub').outerHTML=`<button class="btn" id="cont">Next</button>`;
      $('cont').onclick=()=>{closeSheet();showL2();};
      return;
    }
    penalize('the check failed');
    let msg='<b>That doesn’t add up.</b><ul>';
    if(!evOk){msg+=`<li>Source: ${t.src[ev].why||'that isn’t the right source.'}</li>`;
      sh.querySelectorAll('.src').forEach(x=>x.classList.toggle('wrong',x.dataset.k==ev));}
    if(!vdOk){msg+=`<li>Conclusion: ${t.opt[vd].why||'it doesn’t match the source.'}</li>`;
      sh.querySelectorAll('.opt').forEach(x=>x.classList.toggle('wrong',x.dataset.k==vd));}
    fb.innerHTML=`<div class="fb bad">${msg}</ul></div>`;
  };
}
function openFix(){
  const sel=new Set(); const cards=order('rules',RULES.map((r,k)=>({...r,k})));
  const sh=openSheet(`<h2>Fix the mirror’s instructions</h2>
    <p>The mirror works with no rules at all. Choose the cards worth writing into its instructions.</p>
    <div class="cards">${cards.map(c=>`<button class="cardopt" data-k="${c.k}" aria-pressed="false">${c.t}</button>`).join('')}</div>
    <div id="fb"></div>
    <div class="acts"><span class="muted">Selected: <b id="cnt">0</b></span><button class="btn" id="sub">Save instructions</button></div>`,{wide:true});
  sh.querySelectorAll('.cardopt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k; sel.has(k)?sel.delete(k):sel.add(k);
    b.classList.toggle('sel',sel.has(k)); b.setAttribute('aria-pressed',sel.has(k)); b.classList.remove('shake');
    $('cnt').textContent=sel.size;
  });
  $('sub').onclick=()=>{
    const fb=$('fb');
    if(!sel.size) return fb.innerHTML='<div class="fb info">Pick at least one card.</div>';
    const traps=[...sel].filter(k=>!RULES[k].ok), missing=RULES.filter((r,k)=>r.ok&&!sel.has(k)).length;
    if(!traps.length&&!missing){
      S.l2fix=1; advance();
      $('sheet').innerHTML=`<h2>Instructions saved</h2><p>Here’s what the mirror sees now:</p><div class="promptbox">${PROMPT2}</div>
        <div class="fb info" style="margin-top:12px">A prompt sets the rules, but it doesn’t replace checking against the sources.</div>
        <div class="acts"><button class="btn" id="cont">Next</button></div>`;
      $('cont').onclick=()=>{closeSheet();sealCeremony(1);};
      return;
    }
    penalize('mistakes in the instructions');
    sh.querySelectorAll('.cardopt').forEach(b=>{const k=+b.dataset.k; if(sel.has(k)&&!RULES[k].ok){b.classList.add('shake');}});
    let m='<b>Not yet.</b><ul>';
    traps.forEach(k=>m+=`<li>“${RULES[k].t}” — ${RULES[k].why}</li>`);
    if(missing) m+=`<li>Useful rules still left on the table: ${missing}.</li>`;
    fb.innerHTML=`<div class="fb bad">${m}</ul></div>`;
  };
}

const cur=()=>SC[S.sc];

function openStation(L){

  sh.querySelectorAll('.cardopt').forEach(b=>b.onclick=()=>{

    sh.innerHTML=`<button class="x" data-x aria-label="Close">✕</button><h2>First result</h2>
      <div class="slack"><div class="hd"><i></i><b>${sc.header}</b></div><div class="msg">${esc(sc.out1)}</div></div>
      <p class="muted">${wc(sc.out1)} words · limit ${sc.limit1}</p>
      <div class="fb info">The client is reading it…</div>
      <div class="acts"><button class="btn" id="nx">Deliver to the client</button></div>`;
    sh.querySelector('[data-x]').onclick=closeSheet;
    $('nx').onclick=()=>{ S.p3='patch'; closeSheet(); advance(); showL3(); };
  };
}
function openPatch(){
  const sc=cur(), P=sc.patch, need=P.need;
  const sel=new Set(); let stage=1; const rep={};
  const sh=openSheet(`<h2>Patch the spell</h2>
    <div class="fb info" style="margin:0 0 10px"><b>${sc.who}:</b> “${esc(sc.change)}”</div>
    <p>Which components need replacing? Pick <b>exactly</b> the ones the changes affect.</p>
    <div class="chips" id="chips">${LETTERS.map(l=>`<button class="chip" data-l="${l}"><b>${l}</b>${esc(S.cards[l])}</button>`).join('')}</div>
    <div id="fb"></div>
    <div class="acts"><button class="btn" id="go">Pull out components</button></div>`,{wide:true});
  sh.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    if(stage!==1) return; const l=b.dataset.l; sel.has(l)?sel.delete(l):sel.add(l); b.classList.toggle('sel',sel.has(l));
  });
  $('go').onclick=()=>{
    if(stage===1){
      const ok=sel.size===need.length&&need.every(l=>sel.has(l));
      if(!ok){
        penalize(`exactly ${need.length} components need to change`);
        $('fb').innerHTML=`<div class="fb bad"><b>Not quite.</b> ${P.hint}</div>`; return;
      }
      stage=2; $('fb').innerHTML='';
      const parts=need.map(l=>{const os=order('p'+S.sc+l,P.opts[l].map((o,k)=>({...o,k})),x=>x.ok);
        return `<h4>${l} — ${CRAFT_N[l]}: new version</h4><div class="cards" data-l="${l}">${os.map(o=>`<button class="cardopt" data-k="${o.k}">${o.t}</button>`).join('')}</div>`;}).join('');
      sh.querySelector('.chips').insertAdjacentHTML('afterend',parts);
      $('go').textContent='Cast again'; $('go').disabled=true; return;
    }
    const bad=need.filter(l=>!P.opts[l][rep[l]].ok);
    if(bad.length){
      penalize('that replacement doesn’t fit');
      $('fb').innerHTML=`<div class="fb bad"><b>Not quite.</b><ul>${bad.map(l=>`<li>${l}: ${P.opts[l][rep[l]].why}</li>`).join('')}</ul></div>`;
      return;
    }
    need.forEach(l=>{S.cards[l]=P.opts[l].find(o=>o.ok).t;});
    (async()=>{
      await castAnim(sh,'Casting the updated spell…');
      S.v2=sc.out2; S.p3='test'; S.inspected=false; S.fixedTok=null; advance(); closeSheet(); showL3(); openTest();
    })();
  };
  sh.onclick=e=>{
    const b=e.target.closest('.cardopt'); if(!b||stage!==2) return;
    const l=b.parentElement.dataset.l; rep[l]=+b.dataset.k;
    b.parentElement.querySelectorAll('.cardopt').forEach(x=>x.classList.toggle('sel',x===b));
    $('go').disabled=!need.every(x=>rep[x]!==undefined);
  };
}
function openTest(){
  const sc=cur(), T=sc.test; let selTok=null;
  const drawTokens=flagBad=>S.v2.split(/(\s+)/).map((w,i)=>{
    if(w===''||/^\s+$/.test(w)) return esc(w);
    const bad=T.bad.test(w);
    return `<span class="tok${flagBad&&bad?' flag':''}${S.fixedTok===i?' fixed':''}${selTok===i?' sel':''}" data-i="${i}">${esc(w)}</span>`;
  }).join('');
  const draw=showCheck=>{
    const sh=$('sheet');
    sh.innerHTML=`<button class="x" data-x aria-label="Close">✕</button><h2>Test before delivery</h2>
      <p>The workshop shows its result. Click a word to mark it for the patch.</p>
      <div class="slack"><div class="hd"><i></i><b>${sc.header}</b></div><div class="msg" id="msg">${drawTokens(showCheck)}</div></div>
      ${showCheck?`<ul class="chk">${T.checks(S.v2).map(([ok,t])=>`<li><span class="${ok?'y':'n'}">${ok?'✓':'✗'}</span>${t}</li>`).join('')}</ul>`:''}
      <div id="fb"></div>
      <div class="acts"><button class="btn ghost" id="bInspect">Inspect</button><button class="btn ghost" id="bPatch">Patch</button><button class="btn" id="bDeliver">Deliver</button></div>`;
    sh.querySelector('[data-x]').onclick=closeSheet;
    $('msg').querySelectorAll('.tok').forEach(t=>t.onclick=()=>{selTok=+t.dataset.i;
      $('msg').querySelectorAll('.tok').forEach(x=>x.classList.toggle('sel',+x.dataset.i===selTok));});
    $('bInspect').onclick=()=>{const ok=T.checks(S.v2).every(c=>c[0]);S.inspected=ok;draw(true);
      if(ok) $('fb').innerHTML='<div class="fb ok"><b>All requirements met.</b> Ready to deliver.</div>';};
    $('bPatch').onclick=()=>{
      if(selTok===null){$('fb').innerHTML='<div class="fb info">First click the word in the text that needs fixing.</div>';return;}
      const parts=S.v2.split(/(\s+)/), w=parts[selTok];
      if(T.bad.test(w)){
        parts[selTok]=T.fix(w); S.v2=parts.join(''); S.fixedTok=selTok; S.inspected=false; selTok=null;
        draw(false); $('fb').innerHTML='<div class="fb info">Fixed. Run Inspect again before you deliver.</div>';
      } else {
        penalize('that word isn’t the mistake');
        $('fb').innerHTML='<div class="fb bad">That word doesn’t need fixing. Press Inspect first and compare the text with the requirements.</div>';
      }
    };
    $('bDeliver').onclick=()=>{
      if(S.v2.split(/(\s+)/).some(w=>T.bad.test(w))){
        penalize('the client found the mistake');
        $('fb').innerHTML='<div class="fb bad"><b>The client sent it back:</b> the mistake is still in the text. Inspect first.</div>'; return;
      }
      if(!S.inspected){$('fb').innerHTML='<div class="fb info">The text is fixed but not re-checked. Press Inspect first, then deliver.</div>';return;}
      closeSheet(); advance(); S.p3='done'; practiceDone();
    };
  };
  openSheet('',{wide:true}); draw(false);
}
function practiceDone(){
  const sc=cur(), last=S.sc===2;
  openSheet(`<h2>Practice ${S.sc+1} complete</h2><p><b>${sc.title}</b> delivered.</p>
    <div class="fb info">${sc.lesson}</div>
    <div class="acts"><button class="btn" id="nxp">${last?'Collect the final seal':'Next practice'}</button></div>`,{dismiss:false});
  $('nxp').onclick=()=>{closeSheet(); if(last) sealCeremony(2); else {S.sc++; resetScenario(); showL3();}};
}

/* =====================================================================
   FINISH
   ===================================================================== */
const DEBRIEF='<ul><li>Where didn’t extra power help?</li><li>Which mirror fooled you?</li><li>What did you have to fix in a prompt, and which patch was the hardest?</li></ul>';
async function finish(){
  S.finished=true; S.phase='end'; S.finalTime=elapsed()+S.pen*PEN; S.done=TOTAL; renderSeals(); renderRace();
  const r=await report(); if(r&&r.final) S.finalTime=r.final;   // the server’s time is the official one
  const e=S.finalTime-S.pen*PEN;
  const rows=boardRows(true); const place=rows.findIndex(r=>r.you)+1;
  openSheet(`<div class="stampwrap"><div class="bigseal">🏁</div></div>
    <h2 style="text-align:center">Portal opened!</h2>
    <p style="text-align:center;font-size:20px;margin:4px 0"><b style="font-family:var(--px);font-size:38px">${fmt(S.finalTime)}</b></p>
    <p class="muted" style="text-align:center">net time ${fmt(e)} + ${S.pen} × ${PEN} s penalty · place ${place} of ${rows.length}</p>
    <ol class="rows" style="margin:12px 0">${compactRows(rows,8)}</ol>
    <h4>Discussion · 2 minutes</h4>${DEBRIEF}
    <div class="acts"><button class="btn ghost" id="again">Play again</button></div>`,{wide:true,dismiss:true});
  $('again').onclick=()=>location.reload();
  renderQuest('All three seals are in your passport. Thanks for playing!');
}
function timeUp(){
  if(S.phase==='end') return; S.phase='end';
  S.finalTime=LIMIT+S.pen*PEN; pub();
  openSheet(`<h2>Time’s up</h2><p>The contest is closed. You reached task ${S.done} of ${TOTAL}.</p>
    <h4>Discussion · 2 minutes</h4>${DEBRIEF}
    <div class="acts"><button class="btn ghost" id="again">Play again</button></div>`,{wide:true});
  $('again').onclick=()=>location.reload();
}

/* =====================================================================
   DEV PANEL  (?dev)
   ===================================================================== */
function devPanel(){
  const d=el(`<div id="dev"><button data-j="0">L1</button><button data-j="1">L2</button><button data-j="2">P1</button><button data-j="4">P2</button><button data-j="5">P3</button><button data-j="3">finish</button></div>`);
  document.body.appendChild(d);
  d.onclick=e=>{
    const j=e.target.dataset.j; if(j===undefined) return;
    if(S.phase==='title'||S.phase==='intro'){S.name='Dev';$('screen').hidden=true;closeSheet();enterPlay();}
    closeSheet(); S.raceStart=S.raceStart||nowS(); S.phase='race'; S.busy=false;
    const map={0:0,1:4,2:8,4:11,5:14,3:17}; S.done=map[+j]; renderSeals();
    if(+j===0){S.t1=0;startLevel1();}
    if(+j===1){S.l2=[0,0,0];S.l2fix=0;startLevel2();}
    if(+j===2){startLevel3();}
    if(+j===4){S.level=3;S.sc=1;resetScenario();setScene('workshop',[34,88]);showL3();}
    if(+j===5){S.level=3;S.sc=2;resetScenario();setScene('workshop',[34,88]);showL3();}
    if(+j===3){finish();}
  };
}


/* =====================================================================
   NETWORK  (Vercel API routes; falls back to solo mode when unavailable)
   ===================================================================== */
const NET={on:false,joined:false,offset:0,epoch:0,start:null,players:[],
  room:(params.get('room')||'main').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24)||'main'};
async function netInit(){
  return;   // solo-only build: never talks to a server
  try{
    const t0=Date.now(); const r=await fetch('/api/time',{cache:'no-store'}); if(!r.ok) throw new Error('no api');
    const j=await r.json(); const t1=Date.now();
    NET.offset=j.now-(t0+t1)/2; NET.on=true;
  }catch(e){ NET.on=false; }
}
async function api(path,body){
  const t0=Date.now();
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:NET.room,...body})});
  const j=await r.json().catch(()=>({})); const t1=Date.now();
  if(j.now) NET.offset=j.now-(t0+t1)/2;
  if(!r.ok) throw Object.assign(new Error(j.error||'Request failed'),{status:r.status});
  return j;
}
async function netJoin(){
  if(!NET.on) return;
  try{
    const j=await api('/api/join',{name:S.name,hero:S.hero});
    S.id=j.id; NET.epoch=j.epoch; NET.start=j.start||null; if(j.start&&!S.raceStart) S.raceStart=j.start;
    NET.joined=true;
    netLoop(); setInterval(netLoop,2500); setInterval(()=>report(),15000);
  }catch(e){ NET.on=false; toast('Server unavailable, playing solo'); }
}
async function netLoop(){
  try{
    const r=await fetch(`/api/state?room=${encodeURIComponent(NET.room)}`,{cache:'no-store'}); if(!r.ok) return;
    const j=await r.json();
    if(j.epoch>NET.epoch){ location.reload(); return; }        // the host reset the room
    NET.players=j.players||[]; NET.start=j.start;
    if(j.start&&!S.raceStart) S.raceStart=j.start;
  }catch(e){}
}
async function report(){
  if(!NET.on||!NET.joined) return null;
  try{ return await api('/api/progress',{id:S.id,done:S.done,pen:S.pen,fin:S.finished}); }
  catch(e){ if(e.status===404) return rejoin(); return null; }
}
/* The server forgot us (it restarted): restore our record, with our own progress, under the same id.
   If the host reset the room instead, the server answers 409 and we reload. */
async function rejoin(){
  try{
    await api('/api/join',{name:S.name,hero:S.hero,resume:{id:S.id,epoch:NET.epoch,start:S.raceStart,done:S.done,pen:S.pen,fin:S.finished,final:S.finalTime}});
  }catch(e){ if(e.status===409) location.reload(); }
  return null;
}

/* =====================================================================
   BOOT
   ===================================================================== */
initPlayer();
